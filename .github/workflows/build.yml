name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Download SonarQube Scanner
        run: |
          curl -L -o sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-5.0.1.3006-windows.zip
          tar -xf sonar-scanner.zip
          echo "SONAR_SCANNER_HOME=$PWD/sonar-scanner-5.0.1.3006-windows" >> $env:GITHUB_ENV
          echo "$PWD/sonar-scanner-5.0.1.3006-windows/bin" >> $env:GITHUB_PATH

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner `
            -Dsonar.projectKey=Avianca-EMSA `
            -Dsonar.projectName="Avianca EMSA" `
            -Dsonar.sources=. `
            -Dsonar.sourceEncoding=UTF-8 `
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.*,**/tests/**,**/target/**
