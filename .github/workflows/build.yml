name: SonarQube Local Analysis

on:
  push:
    branches:
      - main

jobs:
  sonarqube:
    name: Run SonarQube Scanner (Local)
    runs-on: self-hosted  # 👈 usa tu runner local (el que ya está escuchando)

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      # 2️⃣ Descargar e instalar SonarQube Scanner CLI
      - name: Install SonarQube Scanner CLI
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-7.3.0.5189-windows-x64.zip" -OutFile "sonar-scanner.zip"
          Expand-Archive sonar-scanner.zip -DestinationPath "C:\sonar-scanner"
          echo "C:\sonar-scanner\sonar-scanner-7.3.0.5189-windows-x64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 3️⃣ Ejecutar el análisis en tu SonarQube local
      - name: Run SonarQube analysis
        shell: powershell
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner `
            -Dsonar.projectKey=Avianca-EMSA `
            -Dsonar.projectName="Avianca EMSA" `
            -Dsonar.sources=. `
            -Dsonar.host.url=$env:SONAR_HOST_URL `
            -Dsonar.token=$env:SONAR_TOKEN `
            -Dsonar.sourceEncoding=UTF-8
