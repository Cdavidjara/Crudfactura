name: SonarQube Local Analysis (Windows CMD - Local Scanner)

on:
  push:
    branches:
      - main

jobs:
  sonarqube:
    name: Run SonarQube Scanner (Local)
    runs-on: self-hosted

    steps:
      # 1️⃣ Clonar el repositorio manualmente (evita error EBUSY)
      - name: Clone repository manually
        shell: cmd
        run: |
          echo ===============================
          echo Clonando repositorio manualmente...
          echo ===============================
          if exist .git (
            echo Repositorio existente, actualizando...
            git fetch origin main
            git reset --hard origin/main
          ) else (
            git clone https://github.com/Cdavidjara/Crudfactura.git .
          )
          git status

      # 2️⃣ Usar el SonarScanner ya instalado localmente
      - name: Configure local SonarScanner
        shell: cmd
        run: |
          echo ===============================
          echo Configurando SonarScanner local...
          echo ===============================
          setx PATH "%PATH%;C:\Users\Admin\Desktop\Arquitectura\sonar-scanner-cli-7.3.0.5189-windows-x64\sonar-scanner-7.3.0.5189-windows-x64\bin"
          echo Configuracion completada.

      # 3️⃣ Ejecutar el análisis con SonarQube local
      - name: Run SonarQube analysis
        shell: cmd
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo ===============================
          echo Iniciando analisis con SonarQube local...
          echo ===============================
          "C:\Users\Admin\Desktop\Arquitectura\sonar-scanner-cli-7.3.0.5189-windows-x64\sonar-scanner-7.3.0.5189-windows-x64\bin\sonar-scanner.bat" ^
            -Dsonar.projectKey=Avianca-EMSA ^
            -Dsonar.projectName="Avianca EMSA" ^
            -Dsonar.sources=. ^
            -Dsonar.host.url=%SONAR_HOST_URL% ^
            -Dsonar.token=%SONAR_TOKEN% ^
            -Dsonar.sourceEncoding=UTF-8
          echo ===============================
          echo Analisis finalizado correctamente.
          echo ===============================
