name: SonarQube Local Analysis (Windows CMD/Powershell)

on:
  push:
    branches:
      - main

jobs:
  sonarqube:
    name: Run SonarQube Scanner (Local)
    runs-on: self-hosted  # tu runner local Windows

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      # ✅ 1️⃣ Clonar manualmente el repositorio para evitar error EBUSY
      - name: Safe checkout repository
        shell: powershell
        run: |
          Write-Host "📂 Clonando repositorio manualmente..."
          if (Test-Path ".git") {
            Write-Host "Repositorio ya existe, actualizando..."
            git fetch origin main
            git reset --hard origin/main
          } else {
            git clone https://github.com/Cdavidjara/Crudfactura.git .
          }
          git status

      # ✅ 2️⃣ Descargar e instalar SonarScanner CLI
      - name: Install SonarQube Scanner CLI
        shell: powershell
        run: |
          Write-Host "⬇️ Descargando SonarScanner CLI..."
          $zipPath = "sonar-scanner.zip"
          Invoke-WebRequest -Uri "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-7.3.0.5189-windows-x64.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "C:\sonar-scanner" -Force
          echo "C:\sonar-scanner\sonar-scanner-7.3.0.5189-windows-x64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "✅ SonarScanner instalado correctamente."

      # ✅ 3️⃣ Ejecutar análisis con tu SonarQube local
      - name: Run SonarQube analysis
        shell: powershell
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          Write-Host "🚀 Ejecutando análisis SonarQube..."
          & "C:\sonar-scanner\sonar-scanner-7.3.0.5189-windows-x64\bin\sonar-scanner.bat" `
            -D"sonar.projectKey=Avianca-EMSA" `
            -D"sonar.projectName=Avianca EMSA" `
            -D"sonar.sources=." `
            -D"sonar.host.url=$env:SONAR_HOST_URL" `
            -D"sonar.token=$env:SONAR_TOKEN" `
            -D"sonar.sourceEncoding=UTF-8"
          Write-Host "✅ Análisis completado exitosamente."
