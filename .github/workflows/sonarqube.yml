name: Build and Analyze

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest  # usa entorno GitHub Actions en Windows

    steps:
      # 🧩 Clona el repositorio sin limpiar archivos temporales (evita EBUSY)
      - name: Checkout repository safely
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      # 🧩 Instala JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      # 🧩 Cache SonarQube
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 🧩 Cache Maven
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 🧩 Compila y analiza con SonarQube
      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar ^
            -Dsonar.projectKey=Avianca-EMSA ^
            -Dsonar.projectName='Avianca EMSA' ^
            -Dsonar.sourceEncoding=UTF-8 ^
            -Dsonar.exclusions=**/target/**
